{% extends "properties/base.html" %}

{% block title %}تماس با مشاور — {{ property.title }}{% endblock %}

{% block content %}
<div class="form-page">
    <div class="page-head" style="padding-top:0;">
        <h1>تماس درباره «{{ property.title }}»</h1>
        <p>فرم زیر را پر کن تا مشاور مربوطه با شما تماس بگیرد.</p>
    </div>

    <div class="form-card">
        <form method="post">
            {% csrf_token %}
            <div class="field-group">
                <label for="name">نام شما</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="field-group">
                <label for="phone">شماره تماس</label>
                <input type="tel" id="phone" name="phone" required>
            </div>
            <div class="field-group">
                <label for="message">پیام</label>
                <textarea id="message" name="message"></textarea>
            </div>
            <div class="form-actions">
                <a href="{% url 'properties:property_detail' property.slug %}" class="btn btn-ghost">انصراف</a>
                <button type="submit" class="btn btn-primary">ارسال پیام</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
